_format_version: "3.0"
services:
# Rule: disallow-excessive-retries (negative)
- name: excessive-retries-service
  retries: 4
# Rule: disallow-excessive-retries (positive)
- name: acceptable-retries-service
  retries: 3
# Rule: disallow-excessive-service-retries (negative)
- name: excessive-service-retries-service
  retries: 3
# Rule: disallow-excessive-service-retries (positive)
- name: acceptable-service-retries-service
  retries: 2
# Rule: enforce-circuit-breaker-config (negative)
- name: no-circuit-breaker-service
# Rule: enforce-circuit-breaker-config (positive)
- name: circuit-breaker-service
  plugins:
  - name: circuit-breaker
# Rule: enforce-production-timeouts (negative)
- name: no-timeouts-service
# Rule: enforce-production-timeouts (positive)
- name: timeouts-service
  connect_timeout: 5000
  read_timeout: 5000
  write_timeout: 5000
# Rule: enforce-service-timeouts (negative)
- name: no-service-timeouts-service
# Rule: enforce-service-timeouts (positive)
- name: service-timeouts-service
  connect_timeout: 5000
  read_timeout: 5000
  write_timeout: 5000
# Rule: enforce-rate-limiting-sync-rate (negative)
- name: low-sync-rate-service
  plugins:
  - name: rate-limiting-advanced
    config:
      sync_rate: 0.5
# Rule: enforce-rate-limiting-sync-rate (positive)
- name: high-sync-rate-service
  plugins:
  - name: rate-limiting-advanced
    config:
      sync_rate: 1
# Rule: recommend-sliding-window-rate-limiting (negative)
- name: fixed-window-service
  plugins:
  - name: rate-limiting
    config:
      strategy: "fixed"
# Rule: recommend-sliding-window-rate-limiting (positive)
- name: sliding-window-service
  plugins:
  - name: rate-limiting
    config:
      strategy: "sliding"

upstreams:
# Rule: recommend-passive-healthchecks (negative)
- name: no-passive-healthchecks-upstream
# Rule: recommend-passive-healthchecks (positive)
- name: passive-healthchecks-upstream
  healthchecks:
    passive:
      healthy:
        successes: 3
      unhealthy:
        http_failures: 3
# Rule: require-active-healthchecks (negative)
- name: no-active-healthchecks-upstream
# Rule: require-active-healthchecks (positive)
- name: active-healthchecks-upstream
  healthchecks:
    active:
      healthy:
        successes: 3
      unhealthy:
        http_failures: 3
# Rule: require-healthchecks-for-upstreams (negative)
- name: no-healthchecks-upstream
# Rule: require-healthchecks-for-upstreams (positive)
- name: healthchecks-upstream
  healthchecks:
    active:
      healthy:
        http_statuses: []
      unhealthy:
        http_statuses: []
