# Kong Gateway Linting Rule: Require OIDC Client Secret in Vault
# Description: This rule ensures that the OIDC plugin's 'client_secret' is
# loaded from Kong Vault. Storing secrets in plaintext configuration is a
# significant security risk. Using Kong Vault provides a secure and centralized
# way to manage sensitive data.

rules:
  oidc-client-secret-in-vault:
    description: "OIDC plugin 'client_secret' must be stored in Kong Vault."
    message: "OIDC plugin 'client_secret' must be a Kong Vault reference (e.g., '{vault://...}')."
    given: "$.plugins[?(@.name == 'oidc')].config"
    severity: "error"
    then:
      field: "client_secret"
      function: pattern
      functionOptions:
        match: "^{vault://.+}$"
