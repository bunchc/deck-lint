rules:
  enforce-request-size-limiting:
    description: "All public-facing routes must have the request-size-limiter plugin configured."
    message: "Route is not tagged as 'internal' and is missing the 'request-size-limiter' plugin."
    given: "$.routes[?(!(@.tags && @.tags.includes('internal')))]"
    severity: "warn"
    then:
      field: plugins
      function: "schema"
      functionOptions:
        schema:
          type: "array"
          contains:
            type: "object"
            properties:
              name:
                const: "request-size-limiter"
            required:
              - name
