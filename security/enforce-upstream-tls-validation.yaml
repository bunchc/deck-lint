rules:
  enforce-upstream-tls-validation:
    description: "Upstream services using HTTPS must have TLS validation enabled."
    message: "Service '{{property}}' uses https protocol but does not have tls_verify enabled."
    given: "$.services[?(@.protocol == 'https')]"
    severity: error
    then:
      field: tls_verify
      function: "truthy"
